name: Daily Brief

# Generate a fresh daily report and publish to GitHub Pages.
#
# One-time setup for forkers (see README → "Run on GitHub Actions"):
#   1. Settings → Actions → General → enable workflows (forked repos start disabled)
#   2. Settings → Pages → Build & deployment → Source: "Deploy from a branch" → gh-pages / root
#   3. Settings → Secrets and variables → Actions:
#        - Secrets: DEEPSEEK_API_KEY (or ANTHROPIC / OPENAI / MINIMAX / ZHIPU as you prefer)
#        - Variables (all optional, sensible defaults provided):
#            LLM_BACKEND     deepseek | anthropic | openai | minimax | zhipu    (default: deepseek)
#            LLM_MODEL       e.g. deepseek-v4-flash / claude-sonnet-4-6  (backend default if unset)
#            REPORT_LOCALE   zh | en                                    (default: zh)
#            Schedule is fixed to 08:00 Europe/London, every day.
#            REPORT_URL      optional public report URL (for custom domains)
#        - Optional Telegram push after a successful Pages publish:
#            Secret: TELEGRAM_BOT_TOKEN; Variable: TELEGRAM_CHAT_ID
#            DISABLE_SOURCE_IDS  comma-separated source ids to skip in CI  (default: linuxdo)
#                            linux.do blocks datacenter IPs, so it can't be
#                            fetched from Actions runners — skipped here, still
#                            works locally. Set "" to attempt all sources.
#   4. Trigger once manually from Actions tab to seed gh-pages.
#
# After first successful run your report is live at:
#   https://<your-username>.github.io/<repo-name>/
#
# Schedule mechanics: cron probes twice per hour because GitHub Actions cron is
# UTC-only. The gate checks the London date and only runs once that day's report
# is absent. Manual runs require force=true to regenerate an existing report.

on:
  schedule:
    # Probe at the hour and half-hour; the gate de-duplicates by report date.
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate today's report even if it already exists
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # needed to push to gh-pages branch

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  gate:
    name: Time gate
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Check schedule
        id: check
        env:
          REPORT_TZ: Europe/London
          REPORT_HOUR: '8'
          REPORT_DAYS: '*'
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ inputs.force }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TZ_VAL="${REPORT_TZ:-Europe/London}"
          HOURS_VAL="${REPORT_HOUR:-8}"
          DAYS_VAL="${REPORT_DAYS:-*}"

          NOW_HOUR=$(TZ="$TZ_VAL" date +%-H)
          NOW_DOW=$(TZ="$TZ_VAL" date +%w)
          NOW_PRINT=$(TZ="$TZ_VAL" date '+%Y-%m-%d %H:%M %Z')

          echo "Now in $TZ_VAL: $NOW_PRINT (hour=$NOW_HOUR, dow=$NOW_DOW)"
          echo "Configured REPORT_HOUR='$HOURS_VAL', REPORT_DAYS='$DAYS_VAL'"

          # Hour match: comma-separated list of integers (0-23).
          hour_match=false
          IFS=',' read -ra HLIST <<< "$HOURS_VAL"
          for h in "${HLIST[@]}"; do
            h_trim="${h// /}"
            if [ "$NOW_HOUR" = "$h_trim" ]; then
              hour_match=true
              break
            fi
          done

          # Day-of-week match: '*', single digits, ranges "a-b", or comma combos.
          day_match=false
          if [ "$DAYS_VAL" = "*" ]; then
            day_match=true
          else
            IFS=',' read -ra DLIST <<< "$DAYS_VAL"
            for d in "${DLIST[@]}"; do
              d_trim="${d// /}"
              if [[ "$d_trim" == *-* ]]; then
                start="${d_trim%-*}"
                end="${d_trim#*-}"
                if [ "$NOW_DOW" -ge "$start" ] && [ "$NOW_DOW" -le "$end" ]; then
                  day_match=true
                  break
                fi
              else
                if [ "$NOW_DOW" = "$d_trim" ]; then
                  day_match=true
                  break
                fi
              fi
            done
          fi

          # Check publication state before allowing either the scheduled run
          # or catchup path. The workflow concurrency group serializes runs,
          # so a second queued gate sees the report published by the first.
          TODAY=$(TZ="$TZ_VAL" date +%Y-%m-%d)
          CHECK_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${TODAY}/${TODAY}.html?ref=gh-pages"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$CHECK_URL" || true)
          if [ "$HTTP_CODE" = "200" ]; then
            if [ "$FORCE_RUN" != "true" ]; then
              echo "Today's report ($TODAY) already exists on gh-pages — skipping duplicate run"
              echo "should-run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Force requested — today's existing report may be regenerated"
          elif [ "$HTTP_CODE" != "404" ]; then
            echo "Could not verify today's report (HTTP $HTTP_CODE); failing closed to avoid duplicate LLM calls"
            exit 1
          fi

          # Manual runs bypass the time/day gate. Existing reports are only
          # regenerated when the user explicitly sets force=true.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger — bypassing time gate"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Catch up after the configured hour if GitHub drops its scheduled
          # trigger. No early run: the report should be for the requested day.
          catchup_match=false
          if [ "$day_match" = "true" ] && [ "$hour_match" = "false" ]; then
            earliest_hour=99
            for h in "${HLIST[@]}"; do
              h_trim="${h// /}"
              if [ "$h_trim" -lt "$earliest_hour" ]; then
                earliest_hour=$h_trim
              fi
            done
            catchup_threshold=$earliest_hour
            if [ "$NOW_HOUR" -ge "$catchup_threshold" ]; then
              echo "↻ Catchup: today's report ($TODAY) missing from gh-pages — recovering"
              catchup_match=true
            fi
          fi

          if [ "$hour_match" = "true" ] && [ "$day_match" = "true" ]; then
            echo "✓ Match — proceeding to build"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          elif [ "$catchup_match" = "true" ]; then
            echo "✓ Catchup — proceeding to build"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "✗ No match — skipping (hour=$hour_match day=$day_match catchup=$catchup_match)"
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & publish
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bring previous reports into the workspace so they survive each run
      # and so build-site can list them all in the archive.
      - name: Restore existing reports from gh-pages
        run: |
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git --work-tree=daily_reports checkout origin/gh-pages -- . || true
            # Drop the index/archive — build-site regenerates them
            rm -f daily_reports/index.html daily_reports/archive.html
            echo "Restored $(ls -1d daily_reports/20*/ 2>/dev/null | wc -l) prior report dirs"
          else
            echo "gh-pages doesn't exist yet — first run"
          fi

      - name: Generate today's report
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND || 'deepseek' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          # Optional proxy / self-hosted endpoints — forward whatever the
          # forker set in Settings → Variables. Empty values are a no-op
          # (backends fall back to the official URL in code).
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          MINIMAX_BASE_URL: ${{ vars.MINIMAX_BASE_URL }}
          ZHIPU_BASE_URL: ${{ vars.ZHIPU_BASE_URL }}
          # Generic aliases — handy when pointing at an OpenAI/Anthropic
          # compatible service that isn't one of the named presets (Moonshot,
          # SiliconFlow, OpenRouter, self-hosted, ...). Provider-specific
          # vars above take precedence when both are set.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          REPORT_TZ: Europe/London
          DAILY_SKIP_IF_EXISTS: 'true'
          DAILY_FORCE: ${{ inputs.force }}
          # Sources to skip in CI (comma-separated ids). linux.do's WAF blocks
          # datacenter egress from Actions runners (and Cloudflare Workers too —
          # no free proxy gets through), so fetching it here always fails. It
          # still works locally, so we skip it only in CI rather than disabling
          # it in the shared config. Override via the DISABLE_SOURCE_IDS
          # Actions Variable if you want a different set.
          DISABLE_SOURCE_IDS: ${{ vars.DISABLE_SOURCE_IDS || 'linuxdo' }}
          WEB_MODE: 'true'
        run: npm run daily

      - name: Build static site (index + archive)
        run: npm run build-site

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily_reports
          publish_branch: gh-pages
          keep_files: false  # we restored everything above, so a clean publish is fine
          commit_message: 'daily: report for ${{ github.run_id }}'

      - name: Notify Telegram after publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          REPORT_TZ: Europe/London
          REPORT_URL: ${{ vars.REPORT_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram notification not configured — skipping"
            exit 0
          fi
          REPORT_DATE="$(TZ="${REPORT_TZ:-Europe/London}" date +%F)" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const date = process.env.REPORT_DATE;
          const reportPath = `daily_reports/${date}/${date}.json`;
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const apiBase = `https://api.github.com/repos/${owner}/${repo}/contents`;
          const markerPath = `.telegram-attempts/${date}.json`;
          const headers = {
            'authorization': `Bearer ${process.env.GH_TOKEN}`,
            'accept': 'application/vnd.github+json',
            'x-github-api-version': '2022-11-28',
            'content-type': 'application/json',
          };

          // Claim the date before sending. Telegram sendMessage has no
          // idempotency key, so a persistent claim is the at-most-once guard.
          const markerUrl = `${apiBase}/${markerPath}?ref=gh-pages`;
          const markerCheck = await fetch(markerUrl, { headers });
          if (markerCheck.ok) {
            console.log(`Telegram notification already attempted for ${date} — skipping`);
            process.exit(0);
          }
          if (markerCheck.status !== 404) {
            throw new Error(`Could not check Telegram marker (HTTP ${markerCheck.status})`);
          }
          const claim = await fetch(`${apiBase}/${markerPath}`, {
            method: 'PUT',
            headers,
            body: JSON.stringify({
              message: `telegram: claim notification for ${date}`,
              branch: 'gh-pages',
              content: Buffer.from(JSON.stringify({ date, run_id: process.env.GITHUB_RUN_ID }) + '\n').toString('base64'),
            }),
          });
          if (!claim.ok) {
            throw new Error(`Could not claim Telegram notification date (HTTP ${claim.status})`);
          }

          const pagePath = repo.toLowerCase() === `${owner}.github.io`.toLowerCase() ? '' : `/${repo}`;
          const url = process.env.REPORT_URL || `https://${owner}.github.io${pagePath}/`;
          const headline = report.hero_headline || '今日简报已发布';
          const text = `📰 Daily Brief · ${date}\n${headline}\n${url}`;

          const response = await fetch(`https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ chat_id: process.env.TELEGRAM_CHAT_ID, text }),
          });
          const result = await response.json();
          if (!response.ok || !result.ok) {
            throw new Error(`Telegram sendMessage failed (HTTP ${response.status})`);
          }
          console.log(`Telegram notification sent for ${date}`);
          NODE
